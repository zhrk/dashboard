<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Dashboard</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --dim: #6e7681;
        --accent: #58a6ff;
        --ok: #3fb950;
        --err: #f85149;
        --warn: #d29922;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        display: flex;
        height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, 'SF Mono', Consolas, monospace;
        font-size: 13px;
      }
      #sidebar {
        width: 240px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
      }
      #sidebar h1 {
        font-size: 13px;
        padding: 12px;
        margin: 0;
        color: var(--dim);
        border-bottom: 1px solid var(--border);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .script-item {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .script-item:hover {
        background: #1c2129;
      }
      .script-item.active {
        background: #1c2129;
        border-left: 2px solid var(--accent);
      }
      .script-item .row1 {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dim);
        flex-shrink: 0;
      }
      .dot.running {
        background: var(--ok);
        box-shadow: 0 0 4px var(--ok);
      }
      .dot.error {
        background: var(--err);
      }
      .dot.restarting {
        background: var(--warn);
      }
      .label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .script-item .actions {
        margin-top: 6px;
        display: flex;
        gap: 6px;
      }
      button {
        background: #21262d;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 11px;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.stop:hover {
        border-color: var(--err);
      }
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #topbar {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #topbar .conn {
        font-size: 11px;
        color: var(--dim);
        margin-left: auto;
      }
      #topbar .conn.up {
        color: var(--ok);
      }
      #topbar .conn.down {
        color: var(--err);
      }
      #log {
        flex: 1;
        margin: 0;
        padding: 12px 16px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.5;
      }
      #empty {
        color: var(--dim);
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h1>Dashboard</h1>
      <div id="script-list"></div>
    </div>
    <div id="main">
      <div id="topbar">
        <strong id="active-label">Select a script</strong>
        <span class="conn down" id="conn-status">disconnected</span>
      </div>
      <pre id="log"></pre>
    </div>

    <script>
      (function () {
        // Registry + per-script client-side log buffer (server also replays on connect).
        const scripts = new Map(); // id -> { label, status }
        const logs = new Map(); // id -> string[]
        let activeId = null;
        let ws = null;

        const listEl = document.getElementById('script-list');
        const logEl = document.getElementById('log');
        const activeLabelEl = document.getElementById('active-label');
        const connEl = document.getElementById('conn-status');

        function connect() {
          const proto = location.protocol === 'https:' ? 'wss' : 'ws';
          ws = new WebSocket(`${proto}://${location.host}/`);

          ws.onopen = () => {
            connEl.textContent = 'connected';
            connEl.className = 'conn up';
          };
          ws.onclose = () => {
            connEl.textContent = 'disconnected — retrying...';
            connEl.className = 'conn down';
            setTimeout(connect, 1500);
          };
          ws.onerror = () => ws.close();
          ws.onmessage = (evt) => {
            const msg = JSON.parse(evt.data);
            if (msg.type === 'registry') handleRegistry(msg.scripts);
            else if (msg.type === 'status') handleStatus(msg.id, msg.status);
            else if (msg.type === 'log') handleLog(msg.id, msg.data);
          };
        }

        function handleRegistry(list) {
          for (const s of list) {
            scripts.set(s.id, { label: s.label, status: s.status });
            if (!logs.has(s.id)) logs.set(s.id, []);
          }
          renderList();
          if (!activeId && list.length) selectScript(list[0].id);
        }

        function handleStatus(id, status) {
          const s = scripts.get(id);
          if (!s) return;
          s.status = status;
          renderList();
        }

        function handleLog(id, data) {
          const buf = logs.get(id) || [];
          buf.push(data);
          if (buf.length > 2000) buf.shift(); // client-side scrollback cap
          logs.set(id, buf);
          if (id === activeId) appendLog(data);
        }

        function renderList() {
          listEl.innerHTML = '';
          for (const [id, s] of scripts) {
            const item = document.createElement('div');
            item.className = 'script-item' + (id === activeId ? ' active' : '');
            item.onclick = (e) => {
              if (e.target.tagName !== 'BUTTON') selectScript(id);
            };

            const row1 = document.createElement('div');
            row1.className = 'row1';
            row1.innerHTML = `<span class="dot ${s.status}"></span><span class="label">${escapeHtml(s.label)}</span>`;

            const actions = document.createElement('div');
            actions.className = 'actions';

            if (s.status === 'running') {
              const stopBtn = document.createElement('button');
              stopBtn.textContent = 'Stop';
              stopBtn.className = 'stop';
              stopBtn.onclick = () => send({ action: 'stop', id });
              const restartBtn = document.createElement('button');
              restartBtn.textContent = 'Restart';
              restartBtn.onclick = () => send({ action: 'restart', id });
              actions.append(stopBtn, restartBtn);
            } else if (s.status === 'restarting') {
              const pendingBtn = document.createElement('button');
              pendingBtn.textContent = 'Restarting…';
              pendingBtn.disabled = true;
              actions.append(pendingBtn);
            } else {
              const startBtn = document.createElement('button');
              startBtn.textContent = 'Start';
              startBtn.onclick = () => send({ action: 'start', id });
              actions.append(startBtn);
            }

            item.append(row1, actions);
            listEl.appendChild(item);
          }
        }

        function selectScript(id) {
          activeId = id;
          const s = scripts.get(id);
          activeLabelEl.textContent = s ? s.label : id;
          logEl.textContent = (logs.get(id) || []).join('');
          logEl.scrollTop = logEl.scrollHeight;
          renderList();
        }

        function appendLog(data) {
          const nearBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 40;
          logEl.textContent += data;
          if (nearBottom) logEl.scrollTop = logEl.scrollHeight;
        }

        function send(obj) {
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
        }

        function escapeHtml(str) {
          return str.replace(
            /[&<>"']/g,
            (c) =>
              ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
              })[c]
          );
        }

        connect();
      })();
    </script>
  </body>
</html>
